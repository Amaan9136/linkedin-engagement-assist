{% extends "base.html" %}
{% block title %}Posts · LinkedIn Engagement Assistant{% endblock %}
{% block content %}
<section class="panel">
<h2>Posts</h2>
<p class="hint">Every post found in your feed. Write drafts, like, comment or skip them here.</p>
<div class="switches">
{% include '_switches.html' %}
<button class="sw" id="btn-autoai" title="When on, the AI writes a draft for every new post. When off, you ask for drafts yourself.">Auto-write drafts</button>
<button class="sw" id="btn-autoscroll" title="Scrolls your LinkedIn feed for 3 minutes to collect more posts. Click again to stop.">Collect more posts</button>
</div>
<div class="toolbar">
<select id="filter" title="Choose which posts to show.">
<option value="all" data-hint="Every post collected from your feed.">All posts</option>
<option value="feed" data-hint="Posts you can still like or comment on.">Open to like or comment</option>
<option value="recent" data-hint="Posts found in the last 24 hours.">Found in the last 24 hours</option>
<option value="older_unprocessed" data-hint="Older posts that never got a draft.">Older, no draft yet</option>
<option value="pending_ai" data-hint="Posts waiting for an AI draft or having one written now.">Waiting for AI draft</option>
<option value="drafts" data-hint="Comments written but not posted yet, approved or not.">Drafts ready</option>
<option value="commented" data-hint="Posts where your comment is live on LinkedIn.">Commented</option>
<option value="liked" data-hint="Posts you have liked.">Liked</option>
<option value="failed" data-hint="Posts with work that failed or is waiting for another try.">Failed or retrying</option>
<option value="skipped" data-hint="Posts the assistant will leave alone.">Skipped</option>
<option value="verification" data-hint="Posts where a like or comment needs your manual check on LinkedIn.">Need your check</option>
</select>
<select id="sort" title="Choose how posts are ordered.">
<option value="recent">Recently found</option>
<option value="oldest">Oldest found</option>
<option value="published_new">Newest on LinkedIn</option>
<option value="published_old">Oldest on LinkedIn</option>
<option value="author">Author A–Z</option>
</select>
<input id="search" type="search" placeholder="Search by author, text or draft" title="Type to filter posts as you type.">
<button class="btn" id="btn-refresh" title="Reload the list now.">Refresh</button>
</div>
<p id="filter-hint" class="hint"></p>
<div class="toolbar bulk">
<button class="btn btn-sm" id="select-page" title="Select every post on this page.">Select page (30)</button>
<button class="btn btn-sm" id="select-all" title="Select every post that matches the current filters, on all pages.">Select all</button>
<button class="btn btn-sm" id="select-none" title="Clear the selection.">Clear</button>
<select id="bulk-action" title="Choose what to do with the selected posts.">
<option value="">Choose an action…</option>
<option value="generate" data-hint="Write AI drafts for the selected posts.">Write drafts</option>
<option value="like" data-hint="Like the selected posts.">Like</option>
<option value="retry" data-hint="Try the failed work on the selected posts again.">Retry failed work</option>
<option value="skip" data-hint="Leave the selected posts alone from now on.">Skip posts</option>
<option value="reset" data-hint="Bring skipped posts back so the assistant handles them again.">Un-skip posts</option>
<option value="delete" data-hint="Permanently remove the selected posts. They will not be collected again.">Delete posts</option>
<option value="open" data-hint="Open up to 10 selected posts on LinkedIn in new tabs.">Open on LinkedIn</option>
</select>
<button class="btn btn-primary" id="bulk-run" title="Run the chosen action on the selected posts.">Apply</button>
<span id="count" class="muted"></span>
</div>
<p id="bulk-hint" class="hint"></p>
</section>
<div id="posts"></div>
<div class="pager"><button class="btn" id="prev" title="Go to the previous page.">Previous</button><span id="page-info" class="muted"></span><button class="btn" id="next" title="Go to the next page.">Next</button></div>
<dialog id="detail"></dialog>
{% endblock %}

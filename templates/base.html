<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ csrf_token }}">
<title>{% block title %}LinkedIn Engagement Assistant{% endblock %}</title>
<link rel="stylesheet" href="{{ asset('css/style.css') }}">
</head>
<body data-page="{{ page }}" data-tz="{{ tz }}">
<header class="topbar">
<div class="brand">LinkedIn Engagement Assistant</div>
<nav>
<a href="/" class="{{ 'active' if page == 'dashboard' }}">Dashboard</a>
<a href="/posts" class="{{ 'active' if page == 'posts' }}">Posts</a>
<a href="/settings" class="{{ 'active' if page == 'settings' }}">Settings</a>
<a href="/logs" class="{{ 'active' if page == 'logs' }}">Logs</a>
</nav>
<div class="right">
<span id="health-pill" class="pill pill-warn">Checking…</span>
<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-ghost" type="submit">Logout</button></form>
</div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<div id="toast" class="toast" hidden></div>
<script src="{{ asset('js/dashboard.js') }}"></script>
</body>
</html>

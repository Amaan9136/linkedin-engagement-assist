{% extends "base.html" %}
{% block title %}Logs · LinkedIn Engagement Assistant{% endblock %}
{% block content %}
<section class="panel">
<h2>Activity log</h2>
<p class="hint">What the assistant has been doing, newest first. Check here when something looks wrong.</p>
<div class="toolbar">
<select id="log-level" title="Choose how serious the entries should be.">
<option value="" data-hint="Show every entry.">Everything</option>
<option value="INFO" data-hint="Normal activity, warnings and errors.">Normal activity and above</option>
<option value="WARNING" data-hint="Warnings and errors only.">Warnings and errors</option>
<option value="ERROR" data-hint="Errors only.">Errors only</option>
</select>
<input id="log-component" placeholder="Source (for example worker)" title="Only show entries from this part of the assistant.">
<input id="log-post" type="number" min="1" placeholder="Post number" title="Only show entries about this post.">
<button class="btn" id="log-refresh" title="Reload the log now.">Refresh</button>
<button class="btn btn-danger" id="log-clear" title="Delete all log entries and empty the log files.">Clear logs</button>
</div>
<p id="log-hint" class="hint"></p>
<div class="table-wrap">
<table class="logs"><thead><tr><th>Time</th><th>Level</th><th>Source</th><th>Post</th><th>Message</th></tr></thead><tbody id="log-body"></tbody></table>
</div>
</section>
{% endblock %}

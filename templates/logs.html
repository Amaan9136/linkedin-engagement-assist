{% extends "base.html" %}
{% block content %}
<section class="panel">
<div class="toolbar">
<select id="log-level">
<option value="">All levels</option>
<option value="INFO">Info and above</option>
<option value="WARNING">Warnings and above</option>
<option value="ERROR">Errors</option>
</select>
<input id="log-component" placeholder="Component (e.g. worker)">
<input id="log-post" type="number" min="1" placeholder="Post ID">
<button class="btn" id="log-refresh">Refresh</button>
</div>
<div class="table-wrap">
<table class="logs"><thead><tr><th>Time</th><th>Level</th><th>Component</th><th>Post</th><th>Message</th></tr></thead><tbody id="log-body"></tbody></table>
</div>
</section>
{% endblock %}

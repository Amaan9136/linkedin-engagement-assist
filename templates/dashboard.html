{% extends "base.html" %}
{% block content %}
<section class="panel">
<h2>Status</h2>
<div class="status-grid">
<div><span class="label">Monitoring</span><strong id="st-monitor">–</strong></div>
<div><span class="label">Browser</span><strong id="st-browser">–</strong></div>
<div><span class="label">LinkedIn session</span><strong id="st-auth">–</strong></div>
<div><span class="label">AI service</span><strong id="st-ai">–</strong></div>
<div><span class="label">Last successful poll</span><strong id="st-last">–</strong></div>
<div><span class="label">Next poll</span><strong id="st-next">–</strong></div>
</div>
<p id="st-msg" class="muted"></p>
<div class="actions">
<button class="btn" id="btn-pause">Pause monitoring</button>
<button class="btn" id="btn-resume">Resume monitoring</button>
<button class="btn" id="btn-poll">Poll now</button>
<button class="btn" id="btn-browser">Restart browser</button>
</div>
</section>
<section class="cards">
<div class="card"><span class="label">Posts discovered</span><strong data-stat="posts_total">0</strong></div>
<div class="card"><span class="label">Awaiting AI</span><strong data-stat="pending_ai">0</strong></div>
<div class="card"><span class="label">Drafts</span><strong data-stat="drafts">0</strong></div>
<div class="card"><span class="label">Comments published</span><strong data-stat="comments_published">0</strong></div>
<div class="card"><span class="label">Posts liked</span><strong data-stat="liked">0</strong></div>
<div class="card"><span class="label">Skipped</span><strong data-stat="skipped">0</strong></div>
<div class="card"><span class="label">Failed / retrying</span><strong data-stat="failed_or_retrying">0</strong></div>
<div class="card"><span class="label">Need verification</span><strong data-stat="verification_required">0</strong></div>
</section>
{% endblock %}
